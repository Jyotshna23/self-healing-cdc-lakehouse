name: Self-Healing Lakehouse CI
on: [push]
jobs:
  verify-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: mkdir -p data/raw data/lakehouse data/quarantine
      - run: python generate_source.py initial
      - run: python pipeline.py
      - run: python generate_source.py delta
      - run: python pipeline.py
      - run: pytest -v
